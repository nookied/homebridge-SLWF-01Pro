name: Release

on:
  push:
    tags: ['v*']
  # Manual runs are an AUTH PROBE, not a release. See the "Probe" step below:
  # it re-publishes the already-published version in package.json, so npm runs
  # the full OIDC exchange and then rejects the upload as a duplicate. Nothing
  # is published, and the run refuses to start if that version is not already
  # on the registry.
  workflow_dispatch:

permissions:
  contents: write   # for `gh release create`
  # Mints the OIDC token npm exchanges for publish rights. This is the
  # ONLY credential in the release path — there is no NPM_TOKEN. See the
  # "Publish to npm" step.
  id-token: write

jobs:
  release:
    name: Publish to npm + GitHub Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # setup-node v5+ auto-caches when package.json carries a `packageManager`
      # field. Ours does not, and `cache: npm` below is explicit, so behaviour is
      # unchanged — but if `packageManager` is ever added, set
      # `package-manager-cache: false` or expect double caching.
      #
      # `node-version: lts/*` (not a pinned 22.x) is required: trusted
      # publishing needs npm >= 11.5.1, and Node 22 ships npm 10. The
      # explicit assert below catches it if lts/* ever moves backwards.
      #
      # NOTE: `registry-url` is deliberately NOT set here, and must not be
      # re-added. It makes setup-node write
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into .npmrc.
      # With trusted publishing there is no NODE_AUTH_TOKEN, so that expands
      # to an empty string — npm then sees "auth is already configured",
      # never starts the OIDC exchange, and fails with the same misleading
      # `404 PUT` that a dead token produces. registry.npmjs.org is the
      # default registry anyway, so nothing is lost by omitting it.
      # See actions/setup-node#1551 and npm/documentation#1960.
      - name: Set up Node (lts/*)
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "Tag: $TAG, package.json: $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Smoke (module loads)
        run: node -e "require('./index.js')"

      # Trusted publishing needs npm >= 11.5.1 (and Node >= 22.14). `lts/*`
      # satisfies both today, but if it ever resolves to something older the
      # publish would fail with an opaque 404 rather than an obvious version
      # problem — so check explicitly and say so.
      - name: Verify npm supports trusted publishing
        run: |
          echo "node $(node --version), npm $(npm --version)"
          node -e '
            const need = [11, 5, 1];
            const got = process.argv[1].split(".").map(Number);
            const ok = got[0] > need[0] ||
              (got[0] === need[0] && (got[1] > need[1] ||
                (got[1] === need[1] && got[2] >= need[2])));
            if (!ok) {
              console.error(`::error::npm ${process.argv[1]} is too old for trusted publishing (need >= 11.5.1). Pin node-version, or add a corepack/npm upgrade step.`);
              process.exit(1);
            }
          ' "$(npm --version)"

      # Belt-and-braces for the trap described above: strip any _authToken
      # line from the runner's npmrc, wherever it came from, so the OIDC
      # exchange is always the path taken.
      - name: Ensure no stale npm auth blocks the OIDC exchange
        run: |
          NPMRC="$(npm config get userconfig)"
          if [ -f "$NPMRC" ] && grep -q '_authToken' "$NPMRC"; then
            echo "Removing _authToken line from $NPMRC"
            sed -i '/_authToken/d' "$NPMRC"
          else
            echo "No _authToken in $NPMRC — nothing to do"
          fi

      # Authenticates via GitHub OIDC against the trusted publisher configured
      # for this package on npmjs.com (org `nookied`, repo
      # `homebridge-SLWF-01Pro`, workflow `release.yml`). No NPM_TOKEN: the
      # previous long-lived Granular Access Token was created 2026-05-24 and
      # Granular Access Tokens cap at 90 days, so it expired 2026-08-22 — the
      # next tagged release would have failed with a misleading `404 PUT`,
      # exactly as homebridge-warmup-v2's v3.12.0 release did.
      #
      # `--provenance` is deliberately absent — trusted publishing generates
      # and publishes the attestation automatically, and passing the flag as
      # well is redundant.
      #
      # If this ever 404s again, the first thing to check is that the trusted
      # publisher config on npmjs.com still matches this repo AND this
      # workflow *filename* — npm matches on the filename alone, so renaming
      # this file silently breaks publishing.
      - name: Publish to npm
        if: github.event_name == 'push'
        run: npm publish --access public

      # ---- Manual auth probe (workflow_dispatch only) ---------------------
      # Proves the OIDC path end to end without releasing anything. npm's
      # `--dry-run` deliberately skips the token exchange (npm/cli#8525), so a
      # real publish is the only way to test auth. Re-publishing a version that
      # already exists is the safe way to do it: the exchange runs in full, then
      # the registry rejects the upload as a duplicate.
      #
      #   403 "cannot publish over ..." -> auth WORKS
      #   404                           -> auth BROKEN (npm reports dead or
      #                                    unmatched auth as a missing package)
      - name: Guard — probe version must already be published
        if: github.event_name == 'workflow_dispatch'
        run: |
          NAME="$(node -p "require('./package.json').name")"
          PKG="$(node -p "require('./package.json').version")"
          echo "package.json: $NAME@$PKG"
          if ! npm view "$NAME@$PKG" version > /dev/null 2>&1; then
            echo "::error::$NAME@$PKG is NOT on the registry — a probe run would publish it for real. Aborting. Cut a real release instead, or point package.json at a published version."
            exit 1
          fi
          echo "$NAME@$PKG is already published — safe to use as an auth probe."

      - name: Probe — verify trusted publishing auth
        if: github.event_name == 'workflow_dispatch'
        run: |
          PKG="$(node -p "require('./package.json').version")"
          set +e
          out="$(npm publish --access public 2>&1)"
          rc=$?
          set -e
          echo "$out"
          echo "--- npm exit code: $rc ---"

          if [ $rc -eq 0 ]; then
            echo "::error::Publish SUCCEEDED for an already-published version. That should be impossible — investigate before releasing."
            exit 1
          fi
          if echo "$out" | grep -qiE 'cannot publish over|previously published'; then
            echo "::notice::AUTH OK — npm completed the OIDC exchange and rejected the upload only because $PKG already exists. Trusted publishing is working."
            exit 0
          fi
          if echo "$out" | grep -qE 'E404|404 Not Found'; then
            echo "::error::AUTH FAILED (404). npm reports dead or unmatched auth as a missing package. Check that the trusted publisher on npmjs.com still matches this org/repo AND the workflow filename release.yml, and that registry-url is not set on setup-node."
            exit 1
          fi
          echo "::error::Unrecognised publish failure — see the npm output above."
          exit 1

      - name: Extract release notes from CHANGELOG
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk "/^## \\[$TAG\\]/{flag=1; next} /^## \\[/{flag=0} flag" CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/master/CHANGELOG.md) for the full release notes." > release-notes.md
          fi

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
